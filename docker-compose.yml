services:
  postgres:
    image: postgres:16-alpine
    container_name: tessera-postgres
    ports:
      - "5442:5432"
    environment:
      POSTGRES_USER: tessera
      POSTGRES_PASSWORD: tessera
      POSTGRES_DB: tessera
    volumes:
      - tessera_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessera"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  tessera_pgdata:
